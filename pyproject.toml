[project]
name = "project-steward"
version = "0.0.1"
description = "Project Truth Engine — reconstruct a trustworthy, self-updating picture of a project from its messy artifact folder."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }

# Core deps: everything needed to boot the API + run migrations.
# The heavy parsing/ML stack lives in the optional `pipeline` group so the
# service (and CI/verification) boots without pulling torch on day one.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "fastapi-users[sqlalchemy]>=14",
    "httpx>=0.28",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
# Deterministic parsing + extraction + local ML. Installed where the pipeline
# actually runs; not required to boot the API or apply migrations.
pipeline = [
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "python-pptx>=1.0",
    "Pillow>=11",
    "exifread>=3.0",
    "spacy>=3.8",
    "dateparser>=1.2",
    "sentence-transformers>=3.3",
    "scikit-learn>=1.5",
    "hdbscan>=0.8.40",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/truth_engine"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's `= Depends(...)` in signatures is the idiomatic DI pattern.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Alembic migrations are autogenerated; don't fight their formatting.
"alembic/versions/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
